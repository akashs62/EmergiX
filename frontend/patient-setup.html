<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Complete Your Profile — EmergiX</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap"
        rel="stylesheet" />
    <script src="js/config.js"></script>
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --emerald: #10B981;
            --emerald-dark: #059669;
            --blue: #3B82F6;
            --blue-dark: #2563EB;
            --dark: #0f172a;
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
            --bg-input: #f8fafc;
            --white: #ffffff;
            --danger: #ef4444;
            --radius: 20px;
            --radius-sm: 12px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body {
            font-family: 'Nunito Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background:
                radial-gradient(circle at 12% 16%, rgba(16, 185, 129, 0.24), transparent 42%),
                radial-gradient(circle at 88% 82%, rgba(59, 130, 246, 0.22), transparent 46%),
                linear-gradient(135deg, #edf6ff 0%, #f5f7fa 40%, #ecfff3 100%);
            padding: 24px;
            overflow-x: hidden;
        }

        .setup-card {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            border-radius: 24px;
            box-shadow: 0 18px 52px rgba(15, 23, 42, 0.14);
            padding: 40px;
            animation: cardAppear 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes cardAppear {
            from { transform: translateY(20px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .setup-header {
            text-align: center;
            margin-bottom: 32px;
        }

        .setup-title {
            font-family: 'Sora', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: var(--dark);
            margin-bottom: 8px;
            letter-spacing: -0.03em;
        }

        .setup-subtitle {
            font-size: 15px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            border: 1.5px solid var(--border);
            border-radius: 12px;
            font-family: 'Nunito Sans', sans-serif;
            font-size: 14px;
            color: var(--text);
            background: var(--bg-input);
            transition: all var(--transition);
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--emerald);
            background: var(--white);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .form-textarea {
            resize: vertical;
            min-height: 80px;
        }

        .setup-btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--emerald), var(--blue));
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all var(--transition);
            margin-top: 10px;
            box-shadow: 0 10px 20px rgba(16, 185, 129, 0.3);
        }

        .setup-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 24px rgba(16, 185, 129, 0.4);
        }

        .setup-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background: rgba(239, 68, 68, 0.08);
            color: var(--danger);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 16px;
            display: none;
            border: 1px solid rgba(239, 68, 68, 0.2);
        }

        .success-overlay {
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.95);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .success-overlay.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .success-icon {
            width: 80px;
            height: 80px;
            background: var(--emerald);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
            margin-bottom: 24px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            animation: bounceIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes bounceIn {
            from { transform: scale(0); }
            to { transform: scale(1); }
        }

        @media (max-width: 640px) {
            .form-grid { grid-template-columns: 1fr; }
            .form-group.full-width { grid-column: span 1; }
            .setup-card { padding: 24px; }
        }
    </style>
</head>

<body>
    <div class="setup-card">
        <div class="setup-header">
            <h1 class="setup-title">Welcome to EmergiX</h1>
            <p class="setup-subtitle">Let's set up your profile to ensure you get the best medical response when every second counts.</p>
        </div>

        <div id="error-box" class="error-message"></div>

        <form id="setup-form">
            <div class="form-grid">
                <!-- Phone Number -->
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" id="phone" class="form-input" placeholder="+91 9876543210" required />
                </div>

                <!-- Age -->
                <div class="form-group">
                    <label class="form-label">Age</label>
                    <input type="number" id="age" class="form-input" placeholder="25" min="1" max="120" required />
                </div>

                <!-- Gender -->
                <div class="form-group">
                    <label class="form-label">Gender</label>
                    <select id="gender" class="form-select" required>
                        <option value="" disabled selected>Select</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <!-- Blood Group -->
                <div class="form-group">
                    <label class="form-label">Blood Group</label>
                    <select id="bloodGroup" class="form-select" required>
                        <option value="" disabled selected>Select</option>
                        <option value="A+">A+</option>
                        <option value="A-">A-</option>
                        <option value="B+">B+</option>
                        <option value="B-">B-</option>
                        <option value="O+">O+</option>
                        <option value="O-">O-</option>
                        <option value="AB+">AB+</option>
                        <option value="AB-">AB-</option>
                    </select>
                </div>

                <!-- Current Problems -->
                <div class="form-group full-width">
                    <label class="form-label">Problems Faced by the Patient</label>
                    <textarea id="problems" class="form-input form-textarea" placeholder="Describe any current medical issues, symptoms, or ongoing conditions" required></textarea>
                </div>

                <!-- Medical Records -->
                <div class="form-group full-width">
                    <label class="form-label">Past Medical Records (if any)</label>
                    <textarea id="medicalRecords" class="form-input form-textarea" placeholder="List past surgeries, chronic illnesses, or recent hospitalizations" required></textarea>
                </div>

            </div>

            <button type="submit" id="submit-btn" class="setup-btn">Complete Setup</button>
        </form>
    </div>

    <!-- Success Overlay -->
    <div id="success-overlay" class="success-overlay">
        <div class="success-icon">✓</div>
        <h2 class="setup-title">Profile Completed!</h2>
        <p class="setup-subtitle">Redirecting you to the dashboard...</p>
    </div>

    <script>
        const setupForm = document.getElementById('setup-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorBox = document.getElementById('error-box');
        const successOverlay = document.getElementById('success-overlay');

        setupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const userId = localStorage.getItem('userId');
            const token = localStorage.getItem('token');
            const apiBase = window.EmergiXConfig ? window.EmergiXConfig.API_BASE_URL : '';

            if (!token) {
                window.location.href = 'signin.html';
                return;
            }

            const payload = {
                phone: document.getElementById('phone').value,
                age: document.getElementById('age').value,
                gender: document.getElementById('gender').value,
                bloodGroup: document.getElementById('bloodGroup').value,
                problems: document.getElementById('problems').value,
                medicalRecords: document.getElementById('medicalRecords').value
            };

            // Enhanced validation with alerts as requested
            for (const key in payload) {
                if (!payload[key] || payload[key].trim() === "") {
                    alert(`Please fill in the required field: ${key.charAt(0).toUpperCase() + key.slice(1).replace(/([A-Z])/g, ' $1')}`);
                    return;
                }
            }

            try {
                submitBtn.disabled = true;
                submitBtn.innerText = 'Saving profile...';
                errorBox.style.display = 'none';

                const response = await fetch(`${apiBase}/api/auth/profile/${userId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${token}`
                    },
                    body: JSON.stringify(payload)
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('profileCompleted', 'true');
                    successOverlay.classList.add('visible');
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);
                } else {
                    throw new Error(data.error || 'Failed to save profile. Please try again.');
                }
            } catch (err) {
                errorBox.innerText = err.message;
                errorBox.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.innerText = 'Complete Setup';
            }
        });

        // Simple auth check
        window.onload = () => {
            if (!localStorage.getItem('token')) {
                window.location.href = 'signin.html';
            }
        };
    </script>
</body>

</html>
